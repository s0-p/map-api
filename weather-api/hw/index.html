<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>open weather map</title>
</head>

<body>
  <h1>다낭 날씨</h1>
  <h2>현재 날씨 : <span id="weather"></span></h2>
  <h3>날씨 설명 : <span id="description"></span></h3>
  <h3>습도 : <span id="chum"></span></h3>
  <h3>풍속 : <span id="wspeed"></span></h3>
  <script>
    const weather = document.querySelector("#weather");
    const description = document.querySelector("#description");
    const chum = document.querySelector("#chum");
    const wspeed = document.querySelector("#wspeed");

    fetch('https://api.openweathermap.org/data/2.5/weather?id=1583992&appid=2dec310fa0b7d6e60e0cc421bc437a01')
      .then(res => res.json())
      .then(result => {
        weather.innerText = result.weather[0].main;
        description.innerText = result.weather[0].description;
        chum.innerText = result.main.humidity;
        wspeed.innerText = result.wind.speed;
      })
  </script>
</body>

</html>
